# netlify.toml
#
# Si ya tenías un netlify.toml en el repo (build command, publish dir,
# headers, etc.), FUSIONA este contenido con el tuyo — no lo reemplaces
# a ciegas. Lo único que este archivo necesita aportar es el registro
# del Edge Function y el fallback de "/".

[[edge_functions]]
  path = "/"
  function = "geo-lang-redirect"

# Red de seguridad si por lo que sea el Edge Function no llega a correr
# (p. ej. una preview branch sin edge functions habilitadas todavía):
# manda a la versión en inglés en vez de a un 404 o a la raíz vacía.
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = false
  conditions = { Cookie = ["myplace_lang=en"] }

[[redirects]]
  from = "/"
  to = "/es/"
  status = 302
  force = false
  conditions = { Cookie = ["myplace_lang=es"] }
