[build]
  command = "npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Nunca cachear el índice de artículos ni el HTML de cada artículo agresivamente,
# para que un artículo recién publicado aparezca sin que el navegador sirva
# una copia vieja desde caché.
[[headers]]
  for = "/content/atelier.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/content/portfolio.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/atelier/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
