backend:
  name: git-gateway
  branch: main

# Se activa desde el dashboard de Netlify: Site configuration → Identity
# (activar) y → Git Gateway (activar). Sin esto, /admin no deja iniciar sesión.

media_folder: "assets/atelier/uploads"
public_folder: "/assets/atelier/uploads"

publish_mode: simple

collections:
  # El sitio es bilingüe: cada idioma tiene su propia colección apuntando a
  # content/atelier/es y content/atelier/en. Un artículo NO se traduce
  # automáticamente — publícalo por separado en cada colección con el mismo
  # "slug" si quieres que exista en los dos idiomas (no es obligatorio: un
  # artículo puede vivir solo en un idioma si así se decide).
  - name: "atelier_es"
    label: "Atelier (Español)"
    label_singular: "Artículo (ES)"
    folder: "content/atelier/es"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Slug (URL, sin espacios ni acentos)", name: "slug", widget: "string", hint: "Ej. gobierno-de-datos-en-portafolios-hospitality" }
      - { label: "Imagen de portada", name: "cover", widget: "image", required: false }
      - { label: "Extracto (aparece en la tarjeta)", name: "excerpt", widget: "text" }
      - label: "Categoría"
        name: "tag"
        widget: "select"
        options: ["Tecnología", "Revenue Management", "Conversión de activos", "Operación", "Mercado", "Institucional"]
      - { label: "Fecha", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Publicado", name: "published", widget: "boolean", default: false, hint: "Solo los artículos marcados como Publicado aparecen en el sitio" }
      - { label: "Contenido", name: "body", widget: "markdown" }
  - name: "atelier_en"
    label: "Atelier (English)"
    label_singular: "Article (EN)"
    folder: "content/atelier/en"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug (URL, no spaces or accents)", name: "slug", widget: "string", hint: "E.g. gobierno-de-datos-en-portafolios-hospitality" }
      - { label: "Cover image", name: "cover", widget: "image", required: false }
      - { label: "Excerpt (shown on the card)", name: "excerpt", widget: "text" }
      - label: "Category"
        name: "tag"
        widget: "select"
        options: ["Technology", "Revenue Management", "Asset Conversion", "Operations", "Market", "Institutional"]
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Published", name: "published", widget: "boolean", default: false, hint: "Only articles marked Published appear on the site" }
      - { label: "Content", name: "body", widget: "markdown" }
